[pytest]
testpaths = tests
# scikit-image's grayreconstruct sets .shape on a NumPy array, which NumPy 2.5
# deprecates. It is their code, not ours, and there is nothing to fix on this
# side — silenced so a real warning from our own code stays visible.
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:skimage.*
