<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BKK Flood Forecast — Live Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin:0; height:100%; font-family: system-ui, sans-serif; }
  #map { height:100%; }
  .panel {
    position:absolute; top:10px; right:10px; z-index:1000;
    background:#fff; border:1px solid #ccc; border-radius:8px;
    padding:10px 14px; font-size:13px; box-shadow:0 1px 4px rgba(0,0,0,.2);
    max-width:260px;
  }
  .panel b { font-size:14px; }
  .legend i {
    display:inline-block; width:12px; height:12px; border-radius:50%;
    margin-right:6px; vertical-align:-1px;
  }
  .muted { color:#666; font-size:12px; }
  button { margin-top:6px; padding:4px 10px; cursor:pointer; }
  input[type=text] { width:150px; padding:3px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <b>BKK Flood Forecast</b>
  <div id="mode" class="muted">loading…</div>
  <div class="legend" style="margin-top:6px">
    <div><i style="background:#2e7d32"></i>ge15 risk &lt; 20% (1h)</div>
    <div><i style="background:#f9a825"></i>20 – 50%</div>
    <div><i style="background:#ef6c00"></i>50 – 75%</div>
    <div><i style="background:#c62828"></i>&gt; 75% or alerting</div>
    <div><i style="background:#9e9e9e"></i>offline / no data</div>
  </div>
  <div style="margin-top:8px">
    <div class="muted">Replay a timestamp (2025):</div>
    <input type="text" id="ts" placeholder="2025-11-02T21:30:00">
    <button onclick="loadReplay()">Replay</button>
    <button onclick="loadLive()">Live</button>
  </div>
  <div id="status" class="muted" style="margin-top:6px"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map("map").setView([13.765, 100.55], 11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  { attribution: "&copy; OpenStreetMap contributors", maxZoom: 18 }).addTo(map);
let layer = L.layerGroup().addTo(map);

function color(st) {
  const h1 = st.horizons["1h"];
  if (st.depth_now_cm === 0 && h1.risk_pct.ge15cm === null) return "#9e9e9e";
  const anyAlert = ["1h","3h","6h"].some(h => st.horizons[h].alert.ge15cm);
  const r = h1.risk_pct.ge15cm;
  if (anyAlert || r > 75) return "#c62828";
  if (r > 50) return "#ef6c00";
  if (r > 20) return "#f9a825";
  return "#2e7d32";
}

function radius(st) {
  const p95 = Math.max(...["1h","3h","6h"].map(h => st.horizons[h].depth_cm.p95));
  return 6 + Math.min(p95, 40) * 0.35;          // 6..20 px
}

function popup(st) {
  const k = st.kpi;
  const rows = ["1h","3h","6h"].map(h => {
    const z = st.horizons[h];
    return `<tr><td>${h}</td><td>${z.risk_pct.ge15cm}%</td>` +
           `<td>${z.depth_cm.p95} cm</td>` +
           `<td>${z.alert.ge15cm ? "&#9888;" : ""}</td></tr>`;
  }).join("");
  return `<b>${st.station_code}</b> <span class="muted">(${st.district_prefix})</span><br>
    Depth now: <b>${st.depth_now_cm} cm</b>
    <table style="font-size:12px;border-spacing:6px 2px">
      <tr class="muted"><td></td><td>ge15 risk</td><td>P95 depth</td><td></td></tr>${rows}
    </table>
    Peak risk: <b>${k.peak_risk_pct}%</b> @ ${k.peak_risk_time_h}h<br>
    ${k.time_to_warning_h ? "Time to warning: <b>" + k.time_to_warning_h + "h</b>" : "No warning at any horizon"}`;
}

function render(data, label) {
  layer.clearLayers();
  let placed = 0;
  for (const st of data.stations) {
    if (st.lat == null) continue;
    L.circleMarker([st.lat, st.lon], {
      radius: radius(st), color: "#fff", weight: 1.5,
      fillColor: color(st), fillOpacity: 0.85,
    }).bindPopup(popup(st)).addTo(layer);
    placed++;
  }
  document.getElementById("mode").textContent = label + " — " + data.ts;
  document.getElementById("status").textContent =
    placed + " stations plotted (coords: district/subdistrict centroids)";
}

async function loadLive() {
  document.getElementById("status").textContent = "fetching live weather…";
  try {
    const r = await fetch("/forecast/live");
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    render(await r.json(), "LIVE (Open-Meteo rain, sensors offline)");
  } catch (e) {
    document.getElementById("status").textContent =
      "Live failed (" + e.message + ") — showing replay demo instead";
    document.getElementById("ts").value = "2025-11-02T21:30:00";
    loadReplay();
  }
}

async function loadReplay() {
  const ts = document.getElementById("ts").value || "2025-11-02T21:30:00";
  document.getElementById("status").textContent = "loading replay…";
  try {
    const r = await fetch("/forecast?ts=" + encodeURIComponent(ts));
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    render(await r.json(), "REPLAY (full sensor features)");
  } catch (e) {
    document.getElementById("status").textContent = "Replay failed: " + e.message;
  }
}

loadLive();
</script>
</body>
</html>
